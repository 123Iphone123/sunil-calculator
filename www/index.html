<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Sunil Calculator</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/basic.css">
</head>

<body>

<!-- Sidebar Menu with History -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h2>Menu</h2>
        <button class="close-btn" id="closeBtn">✖</button>
    </div>
    <ul class="sidebar-links">
        <li><a href="index.html">🧮 Basic Calculator</a></li>
        <li><a href="scientific.html">🧪 Scientific Calculator</a></li>
    </ul>

    <!-- History Section -->
    <div class="history-section">
        <div class="history-header">
            <h3>History</h3>
            <button id="clearHistoryBtn" class="clear-history-btn">Clear</button>
        </div>
        <ul class="history-list" id="historyList">
            <!-- History items yahan load hongi -->
        </ul>
    </div>
</div>

<header class="top-bar">
    <button class="icon-btn" id="menuBtn">☰</button>
    <h2>Calculator</h2>
    <button class="icon-btn" id="themeBtn">🌙</button>
</header>

<main class="container">

    <!-- Display -->
    <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
    </div>

    <!-- Calculator Buttons -->
    <div class="buttons">
        <!-- Row 1 -->
        <button class="btn clear" id="clearBtn">C</button>
        <button class="btn percent" data-value="%">%</button>
        <button class="btn delete" id="deleteBtn">⌫</button>
        <button class="btn operator" data-value="/">÷</button>
        <!-- Row 2 -->
        <button class="btn" data-value="7">7</button>
        <button class="btn" data-value="8">8</button>
        <button class="btn" data-value="9">9</button>
        <button class="btn operator" data-value="*">×</button>
        <!-- Row 3 -->
        <button class="btn" data-value="4">4</button>
        <button class="btn" data-value="5">5</button>
        <button class="btn" data-value="6">6</button>
        <button class="btn operator" data-value="-">−</button>
        <!-- Row 4 -->
        <button class="btn" data-value="1">1</button>
        <button class="btn" data-value="2">2</button>
        <button class="btn" data-value="3">3</button>
        <button class="btn operator" data-value="+">+</button>
        <!-- Row 5 -->
        <button class="btn zero" data-value="0">0</button>
        <button class="btn" data-value=".">.</button>
        <button class="btn equal equal-btn" id="equalBtn">=</button>
    </div>

</main>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="window.location.href='index.html'">
        🧮<br>Basic
    </button>
    <button class="nav-item" onclick="window.location.href='scientific.html'">
        🧪<br>Scientific
    </button>
</nav>

<script src="js/app.js"></script>
<script src="js/basic.js"></script>

</body>
</html>
